name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # AssemblyVersion is passed globally so the Lidarr projects are built with the plugin's low version too.
      # Otherwise the plugin binds to Lidarr.Core 10.0.0.x and fails to load in a real Lidarr install.
      - name: Test
        run: dotnet test tests/ArtistArt.Tests/ArtistArt.Tests.csproj -c Release -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 -p:TreatWarningsAsErrors=false

      - name: Build
        run: >
          dotnet build src/ArtistArt/ArtistArt.csproj -c Release -o _output
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:TreatWarningsAsErrors=false

      - name: Package
        run: cd _output && zip ../ArtistArt.net8.0.zip Lidarr.Plugin.ArtistArt.dll

      - uses: actions/upload-artifact@v4
        with:
          name: ArtistArt.net8.0
          path: ArtistArt.net8.0.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ArtistArt.net8.0.zip --title "$GITHUB_REF_NAME" --generate-notes
